<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Knowledge Base</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f7f8fa; color: #20242a; }
    header { background: #ffffff; border-bottom: 1px solid #d9dee7; padding: 18px 24px; }
    main { padding: 20px 24px; display: grid; gap: 18px; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    section { background: #ffffff; border: 1px solid #d9dee7; border-radius: 8px; padding: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #edf0f4; text-align: left; padding: 8px 10px; vertical-align: top; }
    th { color: #526070; font-weight: 600; background: #fafbfc; }
  </style>
</head>
<body>
  <header>
    <h1>Medical Knowledge Base</h1>
  </header>
  <main>
    {{content}}
  </main>
</body>
</html>
